name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "Could not determine versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Antigravity Files v$VERSION"

      - name: Build Debug APK & run unit tests
        run: gradle assembleDebug testDebugUnitTest --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "build-artifacts/Antigravity-Files-v${{ steps.version.outputs.version }}.apk"
          ls -la build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Files-Debug-APK
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Antigravity Files v${{ steps.version.outputs.version }}
          files: build-artifacts/*.apk
          fail_on_unmatched_files: true
          body: |
            ## Antigravity Files v${{ steps.version.outputs.version }}
            🚀 **Native Android File Manager** built with Kotlin and Jetpack Compose.

            ### 🎨 What's new in v2.3.0:
            - **Stories-Style Home Screen**: A new dashboard with a horizontal recent-media carousel (rounded cards, filename, parent folder or **Downloaded** badge, play badge for videos, 3-dot menu).
            - **Categories Grid**: Downloads, Images, Videos, Audio, Documents and Apps tiles with live sizes, opening the matching filter or folder.
            - **Collections & All Storage**: Starred (Favorites), Recycle Bin, Internal storage and Other storage at a glance.
            - **Redesigned Folder List**: 56dp rounded-square thumbnails, bold filenames and relative timestamps, plus a compact top bar (back-to-home, grid/list, sort, overflow).
            - **Center Action Pill**: One centered blue pill for New folder and New file on the home screen.
            - **Real Video Thumbnails**: `coil-video` frame decoding registered globally, so video cards show actual previews.

            ### ✨ Feature Highlights:
            - Multi-select batch operations (copy, cut/move, share, delete)
            - Favorites, Recent files, and a safe Recycle Bin with restore
            - Async Coil image/video thumbnails
            - Storage overview with per-category breakdown
            - Built-in monospace text viewer
            - Light/Dark/System theming, hidden files toggle, persistent sort & layout
            - APK quick installer, copy-path, and quick file/folder creation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
