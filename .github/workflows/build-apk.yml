name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "Could not determine versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Antigravity Files v$VERSION"

      - name: Build Debug APK & run unit tests
        run: gradle assembleDebug testDebugUnitTest --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "build-artifacts/Antigravity-Files-v${{ steps.version.outputs.version }}.apk"
          ls -la build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Files-Debug-APK
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Antigravity Files v${{ steps.version.outputs.version }}
          files: build-artifacts/*.apk
          fail_on_unmatched_files: true
          body: |
            ## Antigravity Files v${{ steps.version.outputs.version }}
            🚀 **Native Android File Manager** built with Kotlin and Jetpack Compose.

            ### 🎬 What's new in v2.4.0:
            - **Image Viewer**: full-screen viewer with pinch zoom, pan, double-tap zoom, rotate, Edit, Print and **Use as** — plus share, favorite and a 3-dot menu.
            - **Audio Player**: plays the whole folder as a playlist with album art, seek bar, elapsed/total time, shuffle, previous/next, repeat and playback speed.
            - **Video Player**: custom control bar with timeline seek, -10s / +10s, play/pause, screen rotation, buffering indicator and playback speed.
            - **PDF Reader**: every page rendered in-app with page count, print support and a clear message for locked or corrupted files.
            - **Text Viewer Refresh**: same top bar and menu as the other viewers, with copy-all, share and file info.
            - **Universal Routing**: any file type opens the right viewer automatically; other formats fall back to the system "Open with" chooser.
            - **Favorite Files**: star files from the list or from any viewer and open them from the Favorites screen.

            ### ✨ Feature Highlights:
            - Stories-style home dashboard with recent media carousel and category grid
            - Multi-select batch operations (copy, cut/move, share, delete)
            - Favorites, Recent files, and a safe Recycle Bin with restore
            - Async Coil image/video thumbnails
            - Storage overview with per-category breakdown
            - Light/Dark/System theming, hidden files toggle, persistent sort & layout
            - APK quick installer, copy-path, and quick file/folder creation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
