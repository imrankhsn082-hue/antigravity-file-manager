name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "Could not determine versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Antigravity Files v$VERSION"

      - name: Build Debug APK & run unit tests
        run: gradle assembleDebug testDebugUnitTest --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk \
            "build-artifacts/Antigravity-Files-v${{ steps.version.outputs.version }}.apk"
          ls -la build-artifacts/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Antigravity-Files-Debug-APK
          path: build-artifacts/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Antigravity Files v${{ steps.version.outputs.version }}
          files: build-artifacts/*.apk
          fail_on_unmatched_files: true
          body: |
            ## Antigravity Files v${{ steps.version.outputs.version }}
            🚀 **Native Android File Manager** built with Kotlin and Jetpack Compose.

            ### 🔊 What's new in v2.5.0:
            - **Sound Boost Bar**: a separate speaker button opens a 0–200% volume slider — 100% is normal loudness and the extra range adds up to +12 dB gain with `LoudnessEnhancer` for quiet videos.
            - **Dual Audio Switching**: videos with more than one audio track show a headphones button that lists every supported track (plus **Automatic**), and the overflow menu lets you cycle through them.
            - **Subtitle Selection**: embedded subtitle tracks appear behind a CC button with an **Off** option, and the overflow menu cycles Off → track 1 → track 2.
            - **Add External Subtitles**: "Add subtitle file…" opens the document picker for `.srt`, `.vtt`, `.ass`, `.ssa` or `.ttml` files, attaches them to the current video without losing your place, and can remove them again.
            - **Everything else from v2.4.0**: image, audio, video, PDF and text viewers, universal file routing and file favorites.

            ### ✨ Feature Highlights:
            - Stories-style home dashboard with recent media carousel and category grid
            - Multi-select batch operations (copy, cut/move, share, delete)
            - Favorites, Recent files, and a safe Recycle Bin with restore
            - Async Coil image/video thumbnails
            - Storage overview with per-category breakdown
            - Light/Dark/System theming, hidden files toggle, persistent sort & layout
            - APK quick installer, copy-path, and quick file/folder creation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
